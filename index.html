<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK Hosting App</title>
<style>
:root{--g:#138a3d;--g2:#0e6b2f;--bg:#f5f8f6;--card:#fff;--tx:#14211a;--mu:#5b6b62;--bd:#dfe8e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1713;--card:#17231c;--tx:#eaf3ee;--mu:#9bb0a4;--bd:#243629}}
:root[data-theme=dark]{--bg:#0f1713;--card:#17231c;--tx:#eaf3ee;--mu:#9bb0a4;--bd:#243629}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.85}
main{flex:1;overflow-y:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0}
.hero h2{margin:4px 0 6px;font-size:21px}.hero p{margin:0 0 10px;opacity:.9}
h3{margin:0 0 6px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.btn{display:inline-block;background:var(--g);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.w{background:#fff;color:var(--g)}.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}
.row{display:flex;gap:8px}.row>*{flex:1;text-align:center}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:8px;font:inherit;font-weight:600}.seg .on{background:var(--g);color:#fff}
.price{font-size:26px;font-weight:700;color:var(--g)}.tag{background:var(--g);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
ul{padding-left:18px;margin:8px 0}li{margin:2px 0;font-size:13.5px}
.list a{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd);color:var(--tx);text-decoration:none}.list a:last-child{border:0}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;color:var(--mu);font:inherit;font-size:11px}nav .on{color:var(--g);font-weight:700}
nav span{display:block;font-size:20px}
</style></head><body>
<div id="app"><header><div><b>PK Hosting</b><br><small>Web hosting in Pakistan</small></div><span><small>🇵🇰 PKR</small> <button onclick="th()" aria-label="Toggle theme" style="background:rgba(255,255,255,.2);border:0;border-radius:8px;color:#fff;padding:4px 8px;margin-left:6px">◐</button></span></header>
<main id="m"></main>
<nav id="n"></nav></div>
<script>
const S="https://www.pkhosting.com";
const plans=[
 {n:"Personal",f:"Students, hobbyists & individuals",p:699,id:2,l:["1 website","5 GB SSD","5 email accounts","Free SSL","Daily backups (1-day)","Free migration"]},
 {n:"Business",f:"Growing businesses & teams",p:1999,id:3,pop:1,l:["5 websites","25 GB SSD","25 email accounts","Free SSL","Daily backups (3-day)","Priority setup"]},
 {n:"Professional",f:"Software houses & corporates",p:3999,id:4,l:["10 websites","50 GB SSD","50 email accounts","Free SSL","Daily backups (5-day)","Priority support"]}];
const tools=[["WHOIS Lookup","whois"],["DNS Checker","dns-checker"],["SSL Checker","ssl-checker"],["Email Checker","email-checker"],["Website Speed Test","speed-test"],["Domain Appraisal","domain-value"]];
const tabs=[["home","🏠","Home"],["plans","📦","Plans"],["domains","🌐","Domains"],["tools","🛠️","Tools"],["help","💬","Support"]];
let tab="home",bill="m";
const A=(u,t,c="btn")=>`<a class="${c}" href="${u}" target="_blank" rel="noopener">${t}</a>`;
const fmt=n=>"Rs "+n.toLocaleString("en-US");
const V={
home:()=>`<div class="card hero"><small>16+ years · Local support</small><h2>We treat your website as our own.</h2><p>Hosting, domains, VPS and dedicated servers with local support.</p><div class="row"><button class="btn w" onclick="go('plans')">View plans</button>${A(S+"/vps/","Servers","btn o\" style=\"color:#fff;border-color:#fff")}</div></div>
<div class="card"><h3>Find your domain</h3><input id="d" placeholder="yourbusiness.com" autocapitalize="none"><button class="btn" style="width:100%" onclick="go('domains')">Search domain</button>
<div class="chips">${[".com Rs 3,999/yr",".pk Rs 4,699/2yr",".com.pk Rs 4,699/2yr",".net.pk Rs 4,699/2yr"].map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>
<div class="card"><h3>Why PK Hosting</h3><ul><li>SSD storage with a managed stack</li><li>Free SSL on all hosting plans</li><li>Assisted website migration</li><li>1-click WordPress setup</li><li>Tickets answered daily; chat/phone Mon–Fri 9am–6pm PKT</li></ul></div>
<div class="card"><h3>Service status</h3><p class="mu">Check live system status and announcements.</p><div class="row">${A(S+"/status/","System status","btn o")}${A(S+"/announcements/","Announcements","btn o")}</div></div>`,
plans:()=>`<div class="seg"><button class="${bill=="m"?"on":""}" onclick="bill='m';draw()">Monthly</button><button class="${bill=="y"?"on":""}" onclick="bill='y';draw()">Annually</button></div>`+plans.map(p=>`<div class="card"><h3>${p.n}${p.pop?'<span class="tag">Most popular</span>':""}</h3><div class="mu">${p.f}</div><div class="price">${bill=="m"?fmt(p.p)+"<small class='mu'>/mo</small>":fmt(p.p*10)+"<small class='mu'>/yr</small>"}</div><ul>${p.l.map(x=>`<li>${x}</li>`).join("")}</ul>${A(S+"/checkout/?product="+p.id,"Order now","btn\" style=\"width:100%;text-align:center")}</div>`).join("")+`<div class="card"><h3>Need more power?</h3><div class="row">${A(S+"/vps/","VPS","btn o")}${A(S+"/dedicated-servers/","Dedicated","btn o")}${A(S+"/reseller-hosting/","Reseller","btn o")}</div></div><p class="mu">Annual price = 10× monthly. Fair-use policy applies to bandwidth. Prices per pkhosting.com.</p>`,
domains:()=>`<div class="card"><h3>Register a domain</h3><input id="d2" placeholder="yourbusiness.com" autocapitalize="none"><button class="btn" style="width:100%" onclick="window.open(S+'/domains/','_blank')">Check availability on pkhosting.com</button></div>
<div class="card list"><h3>Popular extensions</h3>${[[".com","Rs 3,999/yr"],[".pk","Rs 4,699/2yr"],[".com.pk","Rs 4,699/2yr"],[".org.pk","Rs 4,699/2yr"],[".net.pk","Rs 4,699/2yr"]].map(x=>`<a href="${S}/domains/#pricing" target="_blank"><b>${x[0]}</b><span>${x[1]}</span></a>`).join("")}</div>
<div class="row">${A(S+"/domains/transfer/","Transfer domain","btn o")}${A(S+"/pk-domain-registration/",".pk guide","btn o")}</div>`,
tools:()=>`<div class="card list"><h3>Free tools</h3>${tools.map(t=>`<a href="${S}/tools/${t[1]}/" target="_blank"><span>${t[0]}</span><span>›</span></a>`).join("")}</div><div class="card list"><h3>Learn</h3><a href="${S}/knowledgebase/" target="_blank"><span>Knowledgebase</span><span>›</span></a><a href="${S}/faq/" target="_blank"><span>FAQ</span><span>›</span></a><a href="${S}/blog/" target="_blank"><span>Blog</span><span>›</span></a></div>`,
help:()=>`<div class="card"><h3>Talk to our team</h3><p class="mu">Live chat and phone: Mon–Fri, 9am–6pm PKT. Tickets are answered every day.</p><div class="row">${A("tel:+924235692952","📞 Call")}${A("mailto:support@pkhosting.com","✉️ Email","btn o")}</div><br>${A(S+"/contact/","Open a support ticket","btn o\" style=\"width:100%;text-align:center")}</div>
<div class="card list"><h3>My account</h3><a href="${S}/cart/" target="_blank"><span>Cart & checkout</span><span>›</span></a><a href="${S}/refund/" target="_blank"><span>Refund policy</span><span>›</span></a><a href="${S}/backup-policy/" target="_blank"><span>Backup policy</span><span>›</span></a></div>
<p class="mu">PK Hosting · 231-B Main Boulevard, Phase 8 DHA, Lahore · A product of TechAbout (Private) Limited</p>`};
function go(t){tab=t;draw()}
function draw(){document.getElementById("m").innerHTML=V[tab]();document.getElementById("m").scrollTop=0;
document.getElementById("n").innerHTML=tabs.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("")}
draw();
</script>
<style>.chip{font:inherit;color:var(--tx);cursor:pointer}.chip.on2{background:var(--g);color:#fff;border-color:var(--g)}.star{float:right;background:none;border:0;font-size:22px;color:var(--g);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:center}td:first-child,th:first-child{text-align:left;color:var(--mu)}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{font-weight:600;cursor:pointer}details p{margin:6px 0 0;font-size:13.5px;color:var(--mu)}
.ok{background:#e7f6ec;color:#0e6b2f;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px}@media(prefers-color-scheme:dark){.ok{background:#14301f;color:#9fe0b6}}</style>
<script>
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ld=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};
let short=ld("short",[]),rec=null,dom="",cmp=false,dark=matchMedia("(prefers-color-scheme: dark)").matches;
const star=id=>short.includes(id)?"★":"☆";
function tog(id){short=short.includes(id)?short.filter(x=>x!=id):[...short,id];sv("short",short);draw()}
function rc(n){rec=n;draw()}
function th(){dark=!dark;document.documentElement.dataset.theme=dark?"dark":"light"}
function sd(id){const el=document.getElementById(id);dom=el.value.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").split(/[./]/)[0].replace(/[^a-z0-9-]/g,"").replace(/^-+|-+$/g,"");go("domains")}
function recBox(){const o=[["1 site",1],["2–5",5],["6–10",10],["10+",11]];let out="";
 if(rec){const p=plans[rec<=1?0:rec<=5?1:rec<=10?2:-1];
  out=p?`<p style="margin:10px 0 8px"><b>${p.n} Hosting</b> fits: ${p.l.slice(0,3).join(", ")}.</p>${A(S+"/checkout/?product="+p.id,"Order "+p.n)}`:`<p style="margin:10px 0 8px">For more than 10 sites, look at <b>VPS</b> or <b>Reseller</b>.</p><div class="row">${A(S+"/vps/","VPS","btn o")}${A(S+"/reseller-hosting/","Reseller","btn o")}</div>`}
 return `<div class="card"><h3>Which plan is right for me?</h3><p class="mu" style="margin:0 0 6px">How many websites will you host?</p><div class="chips">${o.map(x=>`<button class="chip${rec==x[1]?" on2":""}" onclick="rc(${x[1]})">${x[0]}</button>`).join("")}</div>${out}</div>`}
const oldHome=V.home;
V.home=()=>{const h=oldHome();const i=h.indexOf('<div class="card"><h3>Find your domain');const j=h.indexOf('<div class="card"><h3>Why PK');
 const dcard=`<div class="card"><h3>Find your domain</h3><input id="d" placeholder="yourbusiness" autocapitalize="none" onkeydown="if(event.key=='Enter')sd('d')"><button class="btn" style="width:100%" onclick="sd('d')">Search domain</button><div class="chips">${[".com Rs 3,999/yr",".pk Rs 4,699/2yr",".com.pk Rs 4,699/2yr",".net.pk Rs 4,699/2yr"].map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`;
 const sl=short.length?`<div class="card"><h3>★ My shortlist</h3>${short.map(id=>{const p=plans.find(x=>x.id==id);return `<div class="row" style="align-items:center;margin:6px 0"><span style="text-align:left">${p.n} · ${fmt(p.p)}/mo</span>${A(S+"/checkout/?product="+p.id,"Order","btn")}</div>`}).join("")}</div>`:"";
 return h.slice(0,i)+dcard+recBox()+sl+h.slice(j)+`<div class="card"><h3>We accept</h3><div class="chips">${["Stripe","PayPal","JazzCash","Easypaisa","Bank account"].map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`};
V.plans=()=>`<div class="seg"><button class="${bill=="m"?"on":""}" onclick="bill='m';draw()">Monthly</button><button class="${bill=="y"?"on":""}" onclick="bill='y';draw()">Annually</button></div>
<button class="btn o" style="width:100%;margin-bottom:12px" onclick="cmp=!cmp;draw()">${cmp?"Hide":"Compare"} plans side by side</button>
${cmp?`<div class="card"><table><tr><th></th>${plans.map(p=>`<th>${p.n}</th>`).join("")}</tr>${[["Websites",[1,5,10]],["SSD (GB)",[5,25,50]],["Email",[5,25,50]],["Backups (days)",[1,3,5]]].map(r=>`<tr><td>${r[0]}</td>${r[1].map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}<tr><td>Price/mo</td>${plans.map(p=>`<td><b>${fmt(p.p)}</b></td>`).join("")}</tr></table></div>`:""}
${plans.map(p=>`<div class="card"><button class="star" aria-label="Shortlist" onclick="tog(${p.id})">${star(p.id)}</button><h3>${p.n}${p.pop?'<span class="tag">Most popular</span>':""}</h3><div class="mu">${p.f}</div><div class="price">${bill=="m"?fmt(p.p)+"<small class='mu'>/mo</small>":fmt(p.p*10)+"<small class='mu'>/yr</small>"}</div>${bill=="y"?`<div class="mu">vs ${fmt(p.p*12)} billed monthly for 12 months</div>`:""}<ul>${p.l.map(x=>`<li>${x}</li>`).join("")}</ul>${A(S+"/checkout/?product="+p.id,"Order now","btn\" style=\"width:100%;text-align:center")}</div>`).join("")}
<div class="card"><h3>Need more power?</h3><div class="row">${A(S+"/vps/","VPS","btn o")}${A(S+"/dedicated-servers/","Dedicated","btn o")}${A(S+"/reseller-hosting/","Reseller","btn o")}</div></div><p class="mu">Annual price = 10× monthly. Bandwidth fair-use applies. Final prices are confirmed at checkout.</p>`;
const X=[[".com","Rs 3,999/yr"],[".pk","Rs 4,699/2yr"],[".com.pk","Rs 4,699/2yr"],[".org.pk","Rs 4,699/2yr"],[".net.pk","Rs 4,699/2yr"]];
V.domains=()=>`<div class="card"><h3>Register a domain</h3><input id="d2" value="${dom}" placeholder="yourbusiness" autocapitalize="none" onkeydown="if(event.key=='Enter')sd('d2')"><button class="btn" style="width:100%" onclick="sd('d2')">Search</button></div>
${dom?`<div class="card list"><h3>Options for “${dom}”</h3>${X.map(x=>`<a href="${S}/domains/" target="_blank"><span><b>${dom}${x[0]}</b><br><small class="mu">${x[1]}</small></span><span style="color:var(--g);font-weight:600">Check ›</span></a>`).join("")}<p class="mu" style="margin:8px 0 0">Live availability is confirmed on pkhosting.com, so you never see a wrong result here.</p></div>`:""}
<div class="row">${A(S+"/domains/transfer/","Transfer domain","btn o")}${A(S+"/pk-domain-registration/",".pk guide","btn o")}</div>`;
const oldTools=V.tools;
V.tools=()=>oldTools()+`<div class="card list"><h3>Services</h3><a href="${S}/ssl/" target="_blank"><span>SSL certificates</span><span>›</span></a><a href="${S}/free-website-migration/" target="_blank"><span>Free website migration</span><span>›</span></a><a href="${S}/web-development/" target="_blank"><span>Web development</span><span>›</span></a><a href="${S}/wordpress-hosting-pakistan/" target="_blank"><span>WordPress hosting</span><span>›</span></a><a href="${S}/partners/" target="_blank"><span>Partner perks</span><span>›</span></a></div>`;
const oldHelp=V.help;
V.help=()=>oldHelp()+`<div class="card"><h3>Quick answers</h3>
<details><summary>When can I reach support?</summary><p>Live chat and phone run Mon–Fri, 9am–6pm PKT. Tickets are answered every day.</p></details>
<details><summary>Is SSL included?</summary><p>Yes, every hosting plan includes a free SSL certificate.</p></details>
<details><summary>How do backups work?</summary><p>Daily backups, kept on the hosting server with 1, 3 or 5 days of retention depending on the plan. Restore is best-effort with no recovery-time SLA, so keep your own copy too.</p></details>
<details><summary>Can you move my site?</summary><p>Yes. Assisted migration is free for eligible websites, email and databases.</p></details>
<details><summary>How can I pay?</summary><p>Stripe, PayPal, JazzCash, Easypaisa or bank account.</p></details></div>`;
draw();
</script></body></html>
